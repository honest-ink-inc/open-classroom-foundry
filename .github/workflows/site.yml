# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publishes the generated static site to GitHub Pages.
#
# THIS WORKFLOW NEVER RUNS BY ITSELF. It is `workflow_dispatch` only — no push
# trigger, no schedule — because publishing puts the Honest Ink name in public,
# and ADR-006 §4 holds a counsel checkpoint in front of that. The forge builds;
# the typist ships. Adding a push trigger is a deliberate decision to be made
# after counsel answers, not a convenience to be added in passing.
#
# The first manual publication completed on 30 Aug 2026, so Pages is already
# configured. Every later run remains a fresh typist act: a human may dispatch it
# through the Actions UI, API, or GitHub CLI, and it must never gain an automatic
# trigger.
# A custom domain (honest-ink.org) is a THIRD, separate act — it is the loudest
# public use of the name, and it is the one ADR-006 most clearly reaches. The
# default *.github.io URL still publishes the name in the page content, so even
# the first run is a naming decision, not merely a technical one.
#
# AGENTS NEVER RUN THIS. The action versions below are exact Node-24-generation
# commits. A typist who deliberately republishes must read that run's own
# conclusion. GitHub's deployment action performs the outward operation; this
# repository does not prove transactional or atomic visibility of that service.

name: Publish site

on:
  workflow_dispatch:

# Pages deployment needs these; nothing else in this repository does.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore the checked-in dependency graph
        run: dotnet restore tools/SiteGenerator/Foundry.Tools.SiteGenerator.csproj --locked-mode --configfile NuGet.config

      # The generator is deterministic by contract (SiteBuilderTests) and reads
      # the repository's own governing documents — the site cannot drift from
      # what the repository actually says.
      - name: Generate the site
        run: dotnet run --project tools/SiteGenerator -c Release --no-restore -- "$PWD" _site

      - name: Show what will be published
        run: ls -la _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
