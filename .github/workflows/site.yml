# SPDX-License-Identifier: GPL-3.0-or-later
#
# Publishes the generated static site to GitHub Pages.
#
# THIS WORKFLOW NEVER RUNS BY ITSELF. It is `workflow_dispatch` only — no push
# trigger, no schedule — because publishing puts the Honest Ink name in public,
# and ADR-006 §4 holds a counsel checkpoint in front of that. The forge builds;
# the typist ships. Adding a push trigger is a deliberate decision to be made
# after counsel answers, not a convenience to be added in passing.
#
# TWO HUMAN ACTS ARE REQUIRED BEFORE THE FIRST RUN, and neither belongs to a
# keyboard agent:
#   1. Enable Pages on the repository with source = GitHub Actions
#      (Settings → Pages). Without it, `deploy-pages` fails.
#   2. Run this workflow manually from the Actions tab.
# A custom domain (honest-ink.org) is a THIRD, separate act — it is the loudest
# public use of the name, and it is the one ADR-006 most clearly reaches. The
# default *.github.io URL still publishes the name in the page content, so even
# the first run is a naming decision, not merely a technical one.
#
# NEVER RUN. Written 29 Aug 2026 against a Pages deployment this repository has
# never performed; the action versions below are the current majors at the time
# of writing and the first run is their first test. If it fails on a version,
# that is the expected failure mode — bump and re-run, nothing is published
# half-way (deploy-pages is atomic).

name: Publish site

on:
  workflow_dispatch:

# Pages deployment needs these; nothing else in this repository does.
permissions:
  contents: read
  pages: write
  id-token: write

# One publish at a time; never cancel a deploy already in flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # The generator is deterministic by contract (SiteBuilderTests) and reads
      # the repository's own governing documents — the site cannot drift from
      # what the repository actually says.
      - name: Generate the site
        run: dotnet run --project tools/SiteGenerator -c Release -- "$PWD" _site

      - name: Show what will be published
        run: ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
