# Pull-request and main-branch CI per implementation plan §12.
#
# Coverage of the plan's CI list, honestly stated:
#   [x] Build on the exact .NET SDK in global.json with warnings as errors
#       (an explicit gate proves the resolved SDK before restore)
#   [x] Unit, contract, schema, and migration tests (dotnet test — suites grow with the code)
#   [x] Secret scan (gitleaks CLI, pinned + checksum-verified, full history) — the licensed
#       Action wrapper was dropped 30 Aug 2026 when moving into an organization made its
#       paid licence binding; the scanner itself is MIT and free
#   [x] Human- and machine-readable NuGet dependency inventories, with the exact normalized
#       direct/transitive package set proved equal to the retained CycloneDX components
#   [x] Known-vulnerability audit over direct and transitive NuGet dependencies
#   [x] Coverage collected (Cobertura via coverlet collector) and published as an artifact
#   [x] Coverage THRESHOLD: Domain+Application+Contracts line coverage >= 80% (measured 88.6% at
#       enablement); Storage and Rendering joined 29 Aug 2026 with honest numbers known first
#       (Storage 93.0%, Rendering 92.5% measured locally at enablement — forge item 6);
#       Modules.DeterministicPress and Modules.BuiltIn joined 29 Aug 2026 the same way
#       (96.6% and 88.8% measured locally at enablement; combined set 93.0% — menu 4 item 7)
#   [x] Formatting gate: FULL `dotnet format --verify-no-changes` (whitespace + curated style
#       + analyzers). The curated .editorconfig pass (handover 2026-08-29, forge item 5)
#       silences only the rules the house deliberately varies on; everything else gates.
#   [x] Full CycloneDX 1.7 JSON SBOM, including dependency license metadata, generated by
#       the exact local-tool-manifest version and retained with the build evidence
#   [x] Deterministic rendering comparisons (byte-identical render tests in the Rendering suite)
#   [x] Deterministic SAMPLES gate: the SampleGenerator runs twice on the runner and every byte
#       is hash-compared (menu 4 item 7) — determinism re-proven on a machine nobody tuned.
#       No exclusions: the .ocfproj writer was made deterministic on 29 Aug 2026 and the last
#       standing exclusion was deleted with it
#   [x] UIA accessibility harness (tests/UiAutomation): in-process contract tests always run;
#       headed UIA tests run where the runner offers an interactive desktop and are VISIBLY
#       skipped otherwise (or with OCF_SKIP_HEADED=1) — a skip is an honest gap, never a pass

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Build, test, inventory, and artifact upload need no repository write scope.
# Declaring this here prevents organization/repository defaults from silently
# granting broader GITHUB_TOKEN authority to code executed by the test jobs.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Exact SDK gate
        shell: pwsh
        run: |
          $settings = Get-Content global.json -Raw | ConvertFrom-Json
          $expected = ([string]$settings.sdk.version).Trim()
          if ([string]::IsNullOrWhiteSpace($expected)) {
            throw 'global.json did not declare a non-empty SDK version.'
          }

          $actual = ([string](& dotnet --version)).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'dotnet --version failed.' }
          if (-not [string]::Equals($actual, $expected, [System.StringComparison]::Ordinal)) {
            throw "Resolved .NET SDK '$actual' did not equal global.json SDK '$expected'."
          }
          Write-Host "Exact .NET SDK: $actual"

      - name: Restore
        run: dotnet restore OpenClassroomFoundry.slnx

      - name: Restore pinned repository tools
        run: dotnet tool restore

      - name: Build (warnings are errors)
        run: dotnet build OpenClassroomFoundry.slnx --no-restore --configuration Release

      - name: Format gate (whitespace + curated style + analyzers)
        run: dotnet format OpenClassroomFoundry.slnx --verify-no-changes

      - name: Test with coverage
        run: dotnet test OpenClassroomFoundry.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Determinism gate (SampleGenerator twice, every byte hash-compared)
        shell: pwsh
        run: |
          $generator = "tools/SampleGenerator/bin/Release/net10.0/Foundry.Tools.SampleGenerator.dll"
          dotnet $generator "$PWD" samples-run-a
          if ($LASTEXITCODE -ne 0) { throw "First samples run failed." }
          dotnet $generator "$PWD" samples-run-b
          if ($LASTEXITCODE -ne 0) { throw "Second samples run failed." }

          # No exclusions. The .ocfproj writer's nondeterminism was fixed on
          # 29 Aug 2026 (deterministic project id, save-instant entry stamps);
          # every byte of every sample must match.
          $filesA = Get-ChildItem samples-run-a -File
          $filesB = Get-ChildItem samples-run-b -File
          if ($filesA.Count -ne $filesB.Count) { throw "Run file counts differ: $($filesA.Count) vs $($filesB.Count)." }

          $failures = @()
          foreach ($file in $filesA) {
            $ha = (Get-FileHash $file.FullName -Algorithm SHA256).Hash
            $hb = (Get-FileHash (Join-Path samples-run-b $file.Name) -Algorithm SHA256).Hash
            if ($ha -ne $hb) { $failures += $file.Name }
          }
          Write-Host "$($filesA.Count) files compared byte-for-byte."
          if ($failures.Count -gt 0) { throw "Nondeterministic output: $($failures -join ', ')" }

      - name: Coverage threshold (core + module assemblies >= 80%)
        shell: pwsh
        run: |
          dotnet tool run reportgenerator -reports:"**/TestResults/**/coverage.cobertura.xml" -targetdir:coverage-report -reporttypes:JsonSummary "-assemblyfilters:+Foundry.Domain;+Foundry.Application;+Foundry.Contracts;+Foundry.Storage;+Foundry.Rendering;+Foundry.Modules.DeterministicPress;+Foundry.Modules.BuiltIn"
          $summary = Get-Content coverage-report/Summary.json | ConvertFrom-Json
          $line = $summary.summary.linecoverage
          Write-Host "Core + module line coverage: $line%"
          if ($line -lt 80) { throw "Line coverage $line% is below the 80% threshold." }

      - name: NuGet dependency inventory (direct + transitive)
        shell: pwsh
        run: |
          $humanInventory = dotnet package list --project OpenClassroomFoundry.slnx --include-transitive --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Human-readable NuGet dependency inventory failed.' }
          $humanInventory | Set-Content dependency-inventory.txt -Encoding utf8NoBOM

          $inventoryJson = dotnet package list --project OpenClassroomFoundry.slnx --include-transitive --format json --output-version 1 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Machine-readable NuGet dependency inventory failed.' }
          $inventoryJson | Set-Content dependency-inventory.json -Encoding utf8NoBOM

          $inventory = Get-Content dependency-inventory.json -Raw | ConvertFrom-Json
          if ($inventory.version -ne 1 -or @($inventory.projects).Count -lt 1) {
            throw 'NuGet dependency inventory was not non-empty output-version 1 JSON.'
          }
          Write-Host "NuGet inventory projects: $(@($inventory.projects).Count)"

      - name: Known-vulnerability audit (direct + transitive)
        shell: pwsh
        run: |
          $json = dotnet package list --project OpenClassroomFoundry.slnx --vulnerable --include-transitive --format json --output-version 1 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'NuGet vulnerability inventory failed.' }
          $json | Set-Content dependency-vulnerabilities.json -Encoding utf8NoBOM
          if ($json -match '"vulnerabilities"\s*:') { throw 'A direct or transitive NuGet dependency has a known vulnerability.' }
          Write-Host 'No known vulnerable NuGet dependency was reported.'

      - name: Full CycloneDX SBOM (pinned tool, no second restore)
        shell: pwsh
        run: |
          function Get-NuGetKey {
            param([object] $Name, [object] $Version, [string] $Context)

            $id = ([string]$Name).Trim()
            $resolvedVersion = ([string]$Version).Trim()
            if ([string]::IsNullOrWhiteSpace($id) -or [string]::IsNullOrWhiteSpace($resolvedVersion)) {
              throw "$Context lacked a non-empty NuGet id or resolved version."
            }
            return "$($id.ToLowerInvariant())@$($resolvedVersion.ToLowerInvariant())"
          }

          function Get-NuGetPurlParts {
            param([string] $Purl, [string] $Context)

            $match = [regex]::Match(
              $Purl,
              '\Apkg:nuget/(?<name>[^@/?#]+)@(?<version>[^/?#]+)\z',
              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
            if (-not $match.Success) { throw "$Context did not carry one bounded NuGet package URL." }
            try {
              return [pscustomobject]@{
                Name = [uri]::UnescapeDataString($match.Groups['name'].Value)
                Version = [uri]::UnescapeDataString($match.Groups['version'].Value)
              }
            }
            catch {
              throw "$Context carried a malformed escaped NuGet package URL."
            }
          }

          $identity = Get-Content src/Foundry.Domain/EngineIdentity.cs -Raw
          if ($identity -notmatch 'public const string EngineVersion = "(?<version>[0-9A-Za-z][0-9A-Za-z.+-]{0,63})";') {
            throw 'Could not read the bounded engine version from EngineIdentity.cs.'
          }
          $engineVersion = $Matches.version
          dotnet tool run dotnet-CycloneDX OpenClassroomFoundry.slnx --output sbom --filename bom.json --output-format Json --spec-version 1.7 --disable-package-restore --no-serial-number --set-name OpenClassroomFoundry --set-version $engineVersion
          $bom = Get-Content sbom/bom.json -Raw | ConvertFrom-Json
          if ($bom.specVersion -ne '1.7' -or $bom.bomFormat -ne 'CycloneDX') { throw 'The generated SBOM did not identify itself as CycloneDX 1.7.' }
          $components = @($bom.components)
          if ($components.Count -lt 1) { throw 'The generated SBOM contained no dependency components.' }

          $inventory = Get-Content dependency-inventory.json -Raw | ConvertFrom-Json
          if ($inventory.version -ne 1 -or @($inventory.projects).Count -lt 1) {
            throw 'NuGet dependency inventory was not non-empty output-version 1 JSON.'
          }

          $inventoryPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $topLevelPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $inventoryTargets = [System.Collections.Generic.List[object]]::new()
          $inventoryTargetIds = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $inventoryOccurrences = 0
          $topLevelOccurrences = 0
          foreach ($project in @($inventory.projects)) {
            $projectPath = ([string]$project.path).Trim()
            if ([string]::IsNullOrWhiteSpace($projectPath) -or -not [System.IO.Path]::IsPathFullyQualified($projectPath) -or
                -not [System.IO.File]::Exists($projectPath) -or @($project.frameworks).Count -lt 1) {
              throw 'A NuGet inventory project lacked its path or target framework.'
            }
            $projectPath = [System.IO.Path]::GetFullPath($projectPath)
            foreach ($framework in @($project.frameworks)) {
              $frameworkName = ([string]$framework.framework).Trim()
              if ([string]::IsNullOrWhiteSpace($frameworkName)) {
                throw "NuGet inventory project '$projectPath' contained an unnamed target framework."
              }
              $frameworkPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
              $frameworkTopLevelPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
              foreach ($collectionName in @('topLevelPackages', 'transitivePackages')) {
                $property = $framework.PSObject.Properties[$collectionName]
                if ($null -eq $property) { continue }
                foreach ($package in @($property.Value)) {
                  $key = Get-NuGetKey $package.id $package.resolvedVersion "$projectPath ($frameworkName) $collectionName"
                  if (-not $frameworkPackages.Add($key)) {
                    throw "NuGet inventory repeated '$key' within $projectPath ($frameworkName)."
                  }
                  [void]$inventoryPackages.Add($key)
                  $inventoryOccurrences++
                  if ($collectionName -eq 'topLevelPackages') {
                    [void]$topLevelPackages.Add($key)
                    [void]$frameworkTopLevelPackages.Add($key)
                    $topLevelOccurrences++
                  }
                }
              }
              $targetId = "$($projectPath.Replace('\', '/').ToLowerInvariant())|$($frameworkName.ToLowerInvariant())"
              if (-not $inventoryTargetIds.Add($targetId)) {
                throw "NuGet inventory repeated project target '$projectPath' ($frameworkName)."
              }
              $inventoryTargets.Add([pscustomobject]@{
                  ProjectPath = $projectPath
                  Framework = $frameworkName
                  Packages = $frameworkPackages
                  TopLevelPackages = $frameworkTopLevelPackages
                })
            }
          }
          if ($inventoryPackages.Count -lt 1 -or $topLevelPackages.Count -lt 1) {
            throw 'NuGet inventory contained no direct/transitive package closure.'
          }

          $componentPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $componentRefs = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $componentPurls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $componentKeyByRef = [System.Collections.Generic.Dictionary[string,string]]::new([System.StringComparer]::Ordinal)
          $componentRefByKey = [System.Collections.Generic.Dictionary[string,string]]::new([System.StringComparer]::Ordinal)
          $invalidLicenseEvidence = @()
          foreach ($component in $components) {
            $name = ([string]$component.name).Trim()
            $version = ([string]$component.version).Trim()
            $key = Get-NuGetKey $name $version "CycloneDX component"
            if ($component.type -ne 'library') { throw "CycloneDX NuGet component '$key' was not typed as a library." }
            if (-not $componentPackages.Add($key)) { throw "CycloneDX repeated NuGet component '$key'." }

            $bomRef = ([string]$component.'bom-ref').Trim()
            $purl = ([string]$component.purl).Trim()
            if ([string]::IsNullOrWhiteSpace($bomRef) -or -not $componentRefs.Add($bomRef)) {
              throw "CycloneDX component '$key' had an empty or duplicate bom-ref."
            }
            if ([string]::IsNullOrWhiteSpace($purl) -or -not $componentPurls.Add($purl)) {
              throw "CycloneDX component '$key' had an empty or duplicate package URL."
            }
            if (-not [string]::Equals($bomRef, $purl, [System.StringComparison]::Ordinal)) {
              throw "CycloneDX component '$key' did not use its NuGet package URL as bom-ref."
            }
            $purlParts = Get-NuGetPurlParts $purl "CycloneDX component '$key'"
            if (-not [string]::Equals($purlParts.Name, $name, [System.StringComparison]::OrdinalIgnoreCase) -or
                -not [string]::Equals($purlParts.Version, $version, [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "CycloneDX component '$key' package URL did not match its name and version."
            }
            $componentKeyByRef.Add($bomRef, $key)
            $componentRefByKey.Add($key, $bomRef)

            $licenseChoices = @($component.licenses)
            if ($licenseChoices.Count -lt 1) {
              $invalidLicenseEvidence += $key
              continue
            }
            foreach ($choice in $licenseChoices) {
              $expression = ([string]$choice.expression).Trim()
              $licenseId = ([string]$choice.license.id).Trim()
              $licenseName = ([string]$choice.license.name).Trim()
              $licenseUrl = ([string]$choice.license.url).Trim()
              $placeholders = @('unknown', 'unknown - see url', 'n/a', 'none', 'noassertion', 'unspecified')
              $expressionIsEvidence = -not [string]::IsNullOrWhiteSpace($expression) -and $expression.ToLowerInvariant() -notin $placeholders
              $idIsEvidence = -not [string]::IsNullOrWhiteSpace($licenseId) -and $licenseId.ToLowerInvariant() -notin $placeholders
              $nameIsPlaceholder = $licenseName.ToLowerInvariant() -in $placeholders
              $urlIsEvidence = $false
              if (-not [string]::IsNullOrWhiteSpace($licenseUrl)) {
                $parsedLicenseUrl = $null
                $urlIsEvidence = [uri]::TryCreate($licenseUrl, [System.UriKind]::Absolute, [ref]$parsedLicenseUrl) -and
                  $parsedLicenseUrl.Scheme -in @('https', 'http')
              }
              if (-not $expressionIsEvidence -and -not $idIsEvidence -and
                  ([string]::IsNullOrWhiteSpace($licenseName) -or ($nameIsPlaceholder -and -not $urlIsEvidence))) {
                $invalidLicenseEvidence += $key
              }
            }
          }
          if ($invalidLicenseEvidence.Count -gt 0) {
            throw "CycloneDX lacked substantive license evidence for: $((@($invalidLicenseEvidence | Sort-Object -Unique)) -join ', ')."
          }

          if (-not $inventoryPackages.SetEquals($componentPackages)) {
            $missing = @($inventoryPackages | Where-Object { -not $componentPackages.Contains($_) } | Sort-Object)
            $extra = @($componentPackages | Where-Object { -not $inventoryPackages.Contains($_) } | Sort-Object)
            throw "NuGet inventory and CycloneDX components differed. Missing from SBOM: $($missing -join ', '); absent from inventory: $($extra -join ', ')."
          }

          # The aggregate generator can bind an edge to another project target's version of
          # the same package id. Each restored assets target is the exact version authority.
          $assetPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $assetEdgesByPackage = [System.Collections.Generic.Dictionary[string,object]]::new([System.StringComparer]::Ordinal)
          $assetPackageOccurrences = 0
          $assetDependencyOccurrences = 0
          foreach ($inventoryTarget in $inventoryTargets) {
            $assetsPath = Join-Path (Split-Path -Parent $inventoryTarget.ProjectPath) 'obj/project.assets.json'
            if (-not [System.IO.File]::Exists($assetsPath)) {
              throw "Restored NuGet assets were missing for '$($inventoryTarget.ProjectPath)'."
            }
            $assets = Get-Content $assetsPath -Raw | ConvertFrom-Json
            $assetTargets = @($assets.targets.PSObject.Properties | Where-Object {
                [string]::Equals($_.Name, $inventoryTarget.Framework, [System.StringComparison]::OrdinalIgnoreCase)
              })
            if ($assetTargets.Count -ne 1) {
              throw "Restored NuGet assets for '$($inventoryTarget.ProjectPath)' did not contain exactly one '$($inventoryTarget.Framework)' target."
            }

            $targetPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            $targetPackageById = [System.Collections.Generic.Dictionary[string,object]]::new([System.StringComparer]::OrdinalIgnoreCase)
            foreach ($entry in @($assetTargets[0].Value.PSObject.Properties)) {
              $library = $assets.libraries.PSObject.Properties[$entry.Name]
              if ($null -eq $library) {
                throw "Restored NuGet target entry '$($entry.Name)' lacked library metadata in '$assetsPath'."
              }
              if (-not [string]::Equals([string]$library.Value.type, 'package', [System.StringComparison]::OrdinalIgnoreCase)) {
                continue
              }

              $separator = $entry.Name.LastIndexOf('/')
              if ($separator -le 0 -or $separator -ge ($entry.Name.Length - 1)) {
                throw "Restored NuGet target entry '$($entry.Name)' was not an exact package id/version pair."
              }
              $packageId = $entry.Name.Substring(0, $separator)
              $packageVersion = $entry.Name.Substring($separator + 1)
              $packageKey = Get-NuGetKey $packageId $packageVersion "Restored NuGet target '$($inventoryTarget.Framework)'"
              if (-not $targetPackages.Add($packageKey)) {
                throw "Restored NuGet target repeated '$packageKey' in '$assetsPath'."
              }
              if ($targetPackageById.ContainsKey($packageId)) {
                throw "Restored NuGet target resolved more than one version of '$packageId' in '$assetsPath'."
              }
              $targetPackageById.Add($packageId, [pscustomobject]@{ Key = $packageKey; Node = $entry.Value })
              [void]$assetPackages.Add($packageKey)
              $assetPackageOccurrences++
              if (-not $assetEdgesByPackage.ContainsKey($packageKey)) {
                $assetEdgesByPackage.Add(
                  $packageKey,
                  [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal))
              }
            }

            if (-not $inventoryTarget.Packages.SetEquals($targetPackages)) {
              $missingTargetPackages = @($inventoryTarget.Packages | Where-Object { -not $targetPackages.Contains($_) } | Sort-Object)
              $extraTargetPackages = @($targetPackages | Where-Object { -not $inventoryTarget.Packages.Contains($_) } | Sort-Object)
              throw "NuGet inventory and restored assets differed for '$($inventoryTarget.ProjectPath)' ($($inventoryTarget.Framework)). Missing from assets: $($missingTargetPackages -join ', '); absent from inventory: $($extraTargetPackages -join ', ')."
            }

            foreach ($package in $targetPackageById.Values) {
              $dependenciesProperty = $package.Node.PSObject.Properties['dependencies']
              if ($null -eq $dependenciesProperty) { continue }
              $unionEdges = $null
              if (-not $assetEdgesByPackage.TryGetValue($package.Key, [ref]$unionEdges)) {
                throw "Restored NuGet source package '$($package.Key)' lacked a union graph node."
              }
              foreach ($dependency in @($dependenciesProperty.Value.PSObject.Properties)) {
                $resolvedDependency = $null
                if (-not $targetPackageById.TryGetValue($dependency.Name, [ref]$resolvedDependency)) {
                  throw "Restored NuGet dependency '$($dependency.Name)' from '$($package.Key)' did not resolve to an exact package version in '$assetsPath'."
                }
                if ([string]::Equals($package.Key, $resolvedDependency.Key, [System.StringComparison]::Ordinal)) {
                  throw "Restored NuGet package '$($package.Key)' declared a self-dependency in '$assetsPath'."
                }
                [void]$unionEdges.Add($resolvedDependency.Key)
                $assetDependencyOccurrences++
              }
            }
          }

          if (-not $inventoryPackages.SetEquals($assetPackages)) {
            $missingAssets = @($inventoryPackages | Where-Object { -not $assetPackages.Contains($_) } | Sort-Object)
            $extraAssets = @($assetPackages | Where-Object { -not $inventoryPackages.Contains($_) } | Sort-Object)
            throw "NuGet inventory and restored asset packages differed. Missing from assets: $($missingAssets -join ', '); absent from inventory: $($extraAssets -join ', ')."
          }

          $root = $bom.metadata.component
          $rootRef = ([string]$root.'bom-ref').Trim()
          if ($root.type -ne 'application' -or $root.name -ne 'OpenClassroomFoundry' -or $root.version -ne $engineVersion -or
              [string]::IsNullOrWhiteSpace($rootRef) -or $componentRefs.Contains($rootRef)) {
            throw 'CycloneDX metadata did not carry the exact, distinct application root.'
          }

          $normalizedDependencies = [System.Collections.Generic.List[object]]::new()
          $normalizedRootRefs = [System.Collections.Generic.List[string]]::new()
          foreach ($packageKey in @($topLevelPackages | Sort-Object)) {
            $packageRef = $null
            if (-not $componentRefByKey.TryGetValue($packageKey, [ref]$packageRef)) {
              throw "Direct NuGet package '$packageKey' lacked an exact CycloneDX component ref."
            }
            $normalizedRootRefs.Add($packageRef)
          }
          $normalizedDependencies.Add([pscustomobject][ordered]@{
              ref = $rootRef
              dependsOn = @($normalizedRootRefs)
            })
          foreach ($packageKey in @($componentPackages | Sort-Object)) {
            $packageRef = $null
            if (-not $componentRefByKey.TryGetValue($packageKey, [ref]$packageRef)) {
              throw "NuGet package '$packageKey' lacked an exact CycloneDX component ref."
            }
            $packageEdges = $null
            if (-not $assetEdgesByPackage.TryGetValue($packageKey, [ref]$packageEdges)) {
              throw "NuGet package '$packageKey' lacked a restored-assets dependency node."
            }
            $normalizedTargetRefs = [System.Collections.Generic.List[string]]::new()
            foreach ($targetKey in @($packageEdges | Sort-Object)) {
              $targetRef = $null
              if (-not $componentRefByKey.TryGetValue($targetKey, [ref]$targetRef)) {
                throw "Restored NuGet dependency '$targetKey' lacked an exact CycloneDX component ref."
              }
              $normalizedTargetRefs.Add($targetRef)
            }
            $normalizedDependencies.Add([pscustomobject][ordered]@{
                ref = $packageRef
                dependsOn = @($normalizedTargetRefs)
              })
          }

          $bom.dependencies = @($normalizedDependencies)
          $bom | ConvertTo-Json -Depth 100 | Set-Content sbom/bom.json -Encoding utf8NoBOM
          $bom = Get-Content sbom/bom.json -Raw | ConvertFrom-Json

          $retainedComponents = @($bom.components)
          $retainedComponentPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $retainedComponentRefs = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($component in $retainedComponents) {
            $retainedKey = Get-NuGetKey $component.name $component.version 'Retained CycloneDX component'
            $retainedRef = ([string]$component.'bom-ref').Trim()
            $expectedRef = $null
            if (-not $componentRefByKey.TryGetValue($retainedKey, [ref]$expectedRef) -or
                -not [string]::Equals($retainedRef, $expectedRef, [System.StringComparison]::Ordinal) -or
                -not [string]::Equals(([string]$component.purl).Trim(), $expectedRef, [System.StringComparison]::Ordinal) -or
                -not $retainedComponentPackages.Add($retainedKey) -or -not $retainedComponentRefs.Add($retainedRef)) {
              throw "Retained CycloneDX component '$retainedKey' did not preserve its exact package/ref mapping."
            }
          }
          if (-not $componentPackages.SetEquals($retainedComponentPackages) -or
              -not $componentRefs.SetEquals($retainedComponentRefs)) {
            throw 'Writing the normalized CycloneDX graph changed the exact retained component/ref set.'
          }
          $retainedRoot = $bom.metadata.component
          if ($retainedRoot.type -ne 'application' -or $retainedRoot.name -ne 'OpenClassroomFoundry' -or
              $retainedRoot.version -ne $engineVersion -or
              -not [string]::Equals(([string]$retainedRoot.'bom-ref').Trim(), $rootRef, [System.StringComparison]::Ordinal)) {
            throw 'Writing the normalized CycloneDX graph changed the exact application root.'
          }
          $components = $retainedComponents

          $dependencyNodes = @($bom.dependencies)
          $nodeRefs = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $edgesByNode = [System.Collections.Generic.Dictionary[string,object]]::new([System.StringComparer]::Ordinal)
          $dependencyEdges = 0
          foreach ($node in $dependencyNodes) {
            $nodeRef = ([string]$node.ref).Trim()
            if ([string]::IsNullOrWhiteSpace($nodeRef) -or -not $nodeRefs.Add($nodeRef)) {
              throw 'CycloneDX dependency graph contained an empty or duplicate node ref.'
            }
            $nodeEdges = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($target in @($node.dependsOn)) {
              $targetRef = ([string]$target).Trim()
              if ([string]::IsNullOrWhiteSpace($targetRef) -or -not $nodeEdges.Add($targetRef)) {
                throw "CycloneDX dependency node '$nodeRef' contained an empty or duplicate edge."
              }
              if ($targetRef -eq $nodeRef -or -not $componentRefs.Contains($targetRef)) {
                throw "CycloneDX dependency node '$nodeRef' referenced an invalid component '$targetRef'."
              }
              $dependencyEdges++
            }
            $edgesByNode.Add($nodeRef, $nodeEdges)
          }

          $expectedNodeRefs = [System.Collections.Generic.HashSet[string]]::new($componentRefs, [System.StringComparer]::Ordinal)
          [void]$expectedNodeRefs.Add($rootRef)
          if (-not $expectedNodeRefs.SetEquals($nodeRefs)) {
            $missingNodes = @($expectedNodeRefs | Where-Object { -not $nodeRefs.Contains($_) } | Sort-Object)
            $extraNodes = @($nodeRefs | Where-Object { -not $expectedNodeRefs.Contains($_) } | Sort-Object)
            throw "CycloneDX dependency nodes were incomplete. Missing: $($missingNodes -join ', '); unexpected: $($extraNodes -join ', ')."
          }

          $rootNode = @($dependencyNodes | Where-Object { $_.ref -eq $rootRef })
          if ($rootNode.Count -ne 1) { throw 'CycloneDX did not contain exactly one application-root dependency node.' }

          $reachableRefs = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          $pendingRefs = [System.Collections.Generic.Queue[string]]::new()
          [void]$reachableRefs.Add($rootRef)
          $pendingRefs.Enqueue($rootRef)
          $visitedNodeCount = 0
          $traversedEdgeCount = 0
          while ($pendingRefs.Count -gt 0) {
            $currentRef = $pendingRefs.Dequeue()
            $visitedNodeCount++
            if ($visitedNodeCount -gt $expectedNodeRefs.Count) {
              throw 'CycloneDX reachability traversal exceeded the declared node bound.'
            }
            $targets = $null
            if (-not $edgesByNode.TryGetValue($currentRef, [ref]$targets)) {
              throw "CycloneDX reachability traversal found no node for '$currentRef'."
            }
            foreach ($targetRef in @($targets)) {
              $traversedEdgeCount++
              if ($traversedEdgeCount -gt $dependencyEdges) {
                throw 'CycloneDX reachability traversal exceeded the declared edge bound.'
              }
              if ($reachableRefs.Add($targetRef)) { $pendingRefs.Enqueue($targetRef) }
            }
          }
          $unreachableComponents = @($componentRefs | Where-Object { -not $reachableRefs.Contains($_) } | Sort-Object)
          if ($unreachableComponents.Count -gt 0) {
            throw "CycloneDX components were disconnected from the application root: $($unreachableComponents -join ', ')."
          }
          if ($traversedEdgeCount -ne $dependencyEdges) {
            throw "CycloneDX root traversal covered $traversedEdgeCount of $dependencyEdges dependency edges."
          }

          $rootPackages = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
          foreach ($targetRef in @($rootNode[0].dependsOn)) {
            $targetKey = $null
            if (-not $componentKeyByRef.TryGetValue($targetRef, [ref]$targetKey)) {
              throw "CycloneDX application root target '$targetRef' lacked an exact component mapping."
            }
            [void]$rootPackages.Add($targetKey)
          }
          if (-not $topLevelPackages.SetEquals($rootPackages)) {
            $missingRoot = @($topLevelPackages | Where-Object { -not $rootPackages.Contains($_) } | Sort-Object)
            $extraRoot = @($rootPackages | Where-Object { -not $topLevelPackages.Contains($_) } | Sort-Object)
            throw "CycloneDX application root did not exactly name the direct NuGet packages. Missing: $($missingRoot -join ', '); unexpected: $($extraRoot -join ', ')."
          }

          $assetUnionEdges = 0
          foreach ($packageKey in $componentPackages) {
            $packageRef = $null
            if (-not $componentRefByKey.TryGetValue($packageKey, [ref]$packageRef)) {
              throw "NuGet package '$packageKey' lacked an exact CycloneDX component ref during graph validation."
            }
            $expectedPackageEdges = $null
            if (-not $assetEdgesByPackage.TryGetValue($packageKey, [ref]$expectedPackageEdges)) {
              throw "NuGet package '$packageKey' lacked a restored-assets dependency node during graph validation."
            }
            $actualPackageRefs = $null
            if (-not $edgesByNode.TryGetValue($packageRef, [ref]$actualPackageRefs)) {
              throw "CycloneDX component '$packageRef' lacked a dependency node during graph validation."
            }
            $actualPackageEdges = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::Ordinal)
            foreach ($targetRef in $actualPackageRefs) {
              $targetKey = $null
              if (-not $componentKeyByRef.TryGetValue($targetRef, [ref]$targetKey)) {
                throw "CycloneDX dependency target '$targetRef' lacked an exact component mapping."
              }
              if (-not $actualPackageEdges.Add($targetKey)) {
                throw "CycloneDX dependency node '$packageRef' repeated normalized package target '$targetKey'."
              }
            }
            if (-not $expectedPackageEdges.SetEquals($actualPackageEdges)) {
              $missingPackageEdges = @($expectedPackageEdges | Where-Object { -not $actualPackageEdges.Contains($_) } | Sort-Object)
              $extraPackageEdges = @($actualPackageEdges | Where-Object { -not $expectedPackageEdges.Contains($_) } | Sort-Object)
              throw "CycloneDX dependencies for '$packageKey' differed from the restored-assets union. Missing: $($missingPackageEdges -join ', '); unexpected: $($extraPackageEdges -join ', ')."
            }
            $assetUnionEdges += $expectedPackageEdges.Count
          }
          $expectedDependencyEdges = $assetUnionEdges + $topLevelPackages.Count
          if ($dependencyEdges -ne $expectedDependencyEdges) {
            throw "CycloneDX dependency graph contained $dependencyEdges edges; restored assets and the application root required exactly $expectedDependencyEdges."
          }

          Write-Host "NuGet packages: $inventoryOccurrences occurrences, $($inventoryPackages.Count) unique; top-level: $topLevelOccurrences occurrences, $($topLevelPackages.Count) unique."
          Write-Host "Restored assets: $($inventoryTargets.Count) project targets, $assetPackageOccurrences package occurrences, $assetDependencyOccurrences dependency occurrences, $assetUnionEdges unique package edges."
          Write-Host "CycloneDX normalized: $($components.Count) unique components, $($dependencyNodes.Count) unique dependency nodes, $dependencyEdges edges; $($componentRefs.Count)/$($componentRefs.Count) components reachable from the application root."
          Write-Host "Substantive license evidence: $($components.Count)/$($components.Count) components."

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-evidence
          path: |
            dependency-inventory.txt
            dependency-inventory.json
            dependency-vulnerabilities.json
            sbom/bom.json
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # gitleaks the SCANNER is MIT-licensed and free; only gitleaks-ACTION,
      # the wrapper, carries organization licensing — which became binding the
      # moment this repository moved from a personal account into an org, and
      # failed the gate with "missing gitleaks license" for four commits while
      # build-and-test stayed green. A GPL project does not put a paid
      # dependency in front of its own security gate, so the scanner runs
      # directly: a pinned release, its published checksum verified BEFORE the
      # binary is executed, scanning full history (fetch-depth 0 above).
      - name: Secret scan (gitleaks CLI, pinned and checksum-verified)
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.30.1
          ASSET="gitleaks_${VERSION}_linux_x64.tar.gz"
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -sSfL "${BASE}/${ASSET}" -o "${ASSET}"
          curl -sSfL "${BASE}/gitleaks_${VERSION}_checksums.txt" -o checksums.txt
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          tar -xzf "${ASSET}" gitleaks
          ./gitleaks version
          ./gitleaks git . --redact --exit-code 1
