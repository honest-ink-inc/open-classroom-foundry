# Pull-request CI per implementation plan §12. This workflow activates when the
# repository gains a GitHub remote; until then it is reviewed as configuration.
#
# Coverage of the plan's CI list, honestly stated:
#   [x] Build on pinned .NET 10 with warnings as errors (global.json + Directory.Build.props)
#   [x] Unit, contract, schema, and migration tests (dotnet test — suites grow with the code)
#   [x] Secret scan (gitleaks)
#   [x] Dependency inventory artifact (SBOM-lite via `dotnet list package`)
#   [x] Coverage collected (Cobertura via coverlet collector) and published as an artifact (R2-11, part 1)
#   [ ] Coverage THRESHOLD enforcement — needs report aggregation tooling; R2-11 part 2
#   [ ] Formatting gate (`dotnet format --verify-no-changes`) — blocked on a one-time line-ending
#       normalization pass (.editorconfig says crlf; much of the tree is lf); do the normalization
#       as its own commit, then enable
#   [ ] Full SBOM (CycloneDX) and license audit tooling — replaces the inventory artifact
#   [x] Deterministic rendering comparisons (byte-identical render tests in the Rendering suite)

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore OpenClassroomFoundry.slnx

      - name: Build (warnings are errors)
        run: dotnet build OpenClassroomFoundry.slnx --no-restore --configuration Release

      - name: Test with coverage
        run: dotnet test OpenClassroomFoundry.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"

      - name: Dependency inventory (SBOM-lite)
        run: dotnet list OpenClassroomFoundry.slnx package --include-transitive > dependency-inventory.txt
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-evidence
          path: |
            dependency-inventory.txt
            **/TestResults/*.trx
            **/TestResults/**/coverage.cobertura.xml

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
