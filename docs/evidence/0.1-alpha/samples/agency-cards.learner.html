<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Approved artifact</title>
<style>
body { font-family: "Segoe UI", system-ui, sans-serif; line-height: 1.5; margin: 2rem; }
.card { border: 1px solid #888; padding: 0.75rem 1rem; margin: 0.75rem 0; }
.card-title { font-weight: 700; margin: 0 0 0.3rem; }
.bilingual-pair { margin: 0.5rem 0; }
.bilingual-pair p { margin: 0.15rem 0; }
.teacher-only { border-left: 4px solid #8a6d24; padding-left: 0.75rem; }
.asset-placeholder { border: 1px dashed #888; padding: 0.5rem; }
.step-symbol { display: inline-block; margin-right: 0.5rem; vertical-align: middle; }
.steps li p { display: inline-block; margin: 0 0.4rem 0 0; }
table { border-collapse: collapse; }
th, td { border: 1px solid #666; padding: 0.3rem 0.6rem; text-align: left; }</style>
</head>
<body>
<figure class="asset-placeholder" data-asset-id="agency.stop.v1"><figcaption>An octagon outline, the shape of a stop sign</figcaption></figure>
<section class="card">
<p class="card-title">Stop</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.help.v1"><figcaption>A life ring: two circles joined by four spokes</figcaption></figure>
<section class="card">
<p class="card-title">Help</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.wait.v1"><figcaption>An hourglass outline</figcaption></figure>
<section class="card">
<p class="card-title">Wait</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.break.v1"><figcaption>A pause symbol: two upright bars</figcaption></figure>
<section class="card">
<p class="card-title">Break</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.different.v1"><figcaption>One path splitting into two diverging arrows</figcaption></figure>
<section class="card">
<p class="card-title">Different</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.not-now.v1"><figcaption>A clock face crossed by a diagonal line</figcaption></figure>
<section class="card">
<p class="card-title">Not now</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.finished.v1"><figcaption>A bold checkmark</figcaption></figure>
<section class="card">
<p class="card-title">Finished</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.yes.v1"><figcaption>A checkmark inside a circle</figcaption></figure>
<section class="card">
<p class="card-title">Yes</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.no.v1"><figcaption>An X inside a circle</figcaption></figure>
<section class="card">
<p class="card-title">No</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.more.v1"><figcaption>A bold plus sign</figcaption></figure>
<section class="card">
<p class="card-title">More</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.do-not-know.v1"><figcaption>A question mark drawn as a curve and a dot</figcaption></figure>
<section class="card">
<p class="card-title">I don&#39;t know</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.consent.v1"><figcaption>Two overlapping circles</figcaption></figure>
<section class="card">
<p class="card-title">We agree</p>
</section>
<figure class="asset-placeholder" data-asset-id="agency.help-hand.v1"><figcaption>An open raised hand with four fingers and a thumb</figcaption></figure>
<section class="card">
<p class="card-title">Help</p>
</section>
</body>
</html>
